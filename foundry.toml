[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.29"
optimizer = true
optimizer_runs = 200
# EIP-7702 (type-4 SetCode txs, used by Enable/DisableDelegation) requires the
# Prague EVM. Sepolia is post-Pectra, so this matches the live network.
evm_version = "prague"
# Fork tests read this; set SEPOLIA_RPC_URL in your environment / .env
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

# Optional named RPC endpoint; `forge test --fork-url sepolia` resolves this.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
